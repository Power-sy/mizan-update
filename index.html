function pullNative(){

  try{var arr=JSON.parse(raw),ids=[];arr.forEach(function(n){ids.push(n.id);addPending(n)});if(ids.length){natCall('ack',[JSON.stringify(ids)]);homeRender();if(!$('tab-more').hidden)moreRender()}}catch(e){}}
function prefillMonth(k){
  var m=S.log[k];if(m&&(m.income.length||m.expense.length))return m;
  var prev=Object.keys(S.log).filter(function(x){var y=S.log[x];return x<k&&(y.income.length||y.expense.length)}).sort().pop();
  m=S.log[k]=S.log[k]||{income:[],expense:[]};
  if(prev&&!(S.noFill&&S.noFill[k])){var cp=function(a){return a.map(function(i){var o={v:num(i.v)};if(i.c!==undefined)o.c=i.c;if(i.n)o.n=i.n;return o})};m.income=cp(S.log[prev].income);m.expense=cp(S.log[prev].expense);(S.filled=S.filled||{})[k]=prev}
  return m}
function recordPending(id){
  var card=document.querySelector('[data-pid="'+id+'"]'),p=S.pend.filter(function(x){return x.id===id})[0];if(!card||!p)return;
  var type=card.querySelector('.ptype').value,amt=num(card.querySelector('.pamt').value),cat=card.querySelector(type==='income'?'.pcat-i':'.pcat-e').value;
  if(!(amt>0)){mzToast(t('m_noamt'));return}
  var m=prefillMonth(mkey(p.ts));m[type].push({c:cat,v:amt,auto:1});
  S.auto=S.auto||[];S.auto.unshift({ts:p.ts,amt:amt,type:type,cat:cat});if(S.auto.length>20)S.auto.length=20;
  S.pend=S.pend.filter(function(x){return x.id!==id});save();mzToast(t('m_done'));refreshAll()}

var SYNC_SQL="create table if not exists public.mizan_data (\n  user_id uuid primary key references auth.users(id) on delete cascade,\n  data jsonb not null,\n  updated_at timestamptz not null default now()\n);\nalter table public.mizan_data enable row level security;\ncreate policy \"own select\" on public.mizan_data for select using (auth.uid() = user_id);\ncreate policy \"own insert\" on public.mizan_data for insert with check (auth.uid() = user_id);\ncreate policy \"own update\" on public.mizan_data for update using (auth.uid() = user_id) with check (auth.uid() = user_id);";
var mzPw='';
function scfg(){try{return JSON.parse(localStorage.getItem('mizan.sync.cfg')||'{}')}catch(e){return{}}}
function sses(){try{return JSON.parse(localStorage.getItem('mizan.sync.ses')||'null')}catch(e){return null}}
function setSes(s){try{if(s)localStorage.setItem('mizan.sync.ses',JSON.stringify(s));else localStorage.removeItem('mizan.sync.ses')}catch(e){}}
async function sb(path,opt,token){
  var c=scfg();if(!c.url||!c.key)throw new Error(t('s_cfg'));
  opt=opt||{};opt.headers=Object.assign({apikey:c.key,'Content-Type':'application/json'},opt.headers||{});
  if(token)opt.headers.Authorization='Bearer '+token;
  var r=await fetch(c.url.replace(/\/+$/,'')+path,opt),txt=await r.text(),j=null;try{j=txt?JSON.parse(txt):null}catch(e){}
  if(!r.ok)throw new Error((j&&(j.msg||j.message||j.error_description||j.error))||('HTTP '+r.status));
  return j}
function storeSes(j){setSes({at:j.access_token,rt:j.refresh_token,exp:Date.now()+(j.expires_in||3600)*1000,uid:j.user&&j.user.id,email:j.user&&j.user.email})}
async function token(){
  var s=sses();if(!s)throw new Error(t('s_need'));
  if(s.exp-60000<Date.now()){var j=await sb('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:JSON.stringify({refresh_token:s.rt})});storeSes(j);s=sses()}
  return s}
async function syncAct(a){
  try{
    var em=($('mzMail')||{}).value||'',pw=mzPw;
    if(a==='sign'){if(!em||!pw)throw new Error(t('s_cfg'));await sb('/auth/v1/signup',{method:'POST',body:JSON.stringify({email:em,password:pw})});mzToast(t('s_signok'))}
    else if(a==='login'){if(!em||!pw)throw new Error(t('s_cfg'));storeSes(await sb('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:em,password:pw})}));mzToast(t('s_loginok'));moreRender()}
    else if(a==='up'){var s=await token();await sb('/rest/v1/mizan_data?on_conflict=user_id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({user_id:s.uid,data:S,updated_at:new Date().toISOString()})},s.at);try{localStorage.setItem('mizan.sync.last',new Date().toISOString())}catch(e){}mzToast(t('s_upok'));moreRender()}
    else if(a==='down'){var s2=await token(),rows=await sb('/rest/v1/mizan_data?select=data,updated_at&user_id=eq.'+s2.uid,{method:'GET'},s2.at);
      if(!rows||!rows.length||!rows[0].data||!rows[0].data.assets){mzToast(t('s_none'));return}
      if(!confirm(t('s_dlc')))return;replaceState(rows[0].data);try{localStorage.setItem('mizan.sync.last',new Date().toISOString())}catch(e){}mzToast(t('s_dlok'))}
    else if(a==='out'){setSes(null);moreRender()}
  }catch(e){mzToast(t('s_err')+e.message)}}

document.addEventListener('click',function(e){
  var b=e.target.closest?e.target.closest('[data-act],[data-go]'):null;if(!b)return;
  if(b.dataset.go){setTab(b.dataset.go);return}
  var a=b.dataset.act;
  if(a==='grant')natCall('openAccess');
  else if(a==='addkw'){var v=($('mzKw').value||'').trim();if(v&&S.kw.indexOf(v)<0){S.kw.push(v);save();natCall('setKeywords',[JSON.stringify(S.kw)]);moreRender()}}
  else if(a==='rmkw'){S.kw.splice(+b.dataset.i,1);save();natCall('setKeywords',[JSON.stringify(S.kw)]);moreRender()}
  else if(a==='rec')recordPending(b.dataset.id);
  else if(a==='ign'){S.pend=S.pend.filter(function(x){return x.id!==b.dataset.id});save();refreshAll()}
  else if(a==='sim'){var tx=($('mzSim').value||'').trim();if(!matchKw(tx)){mzToast(t('m_nokw'));return}if(!extractAmount(tx)){mzToast(t('m_noamt'));return}

  else if(a==='copy'){copyText($('mzExpOut').value)}
  else if(a==='copysql')copyText(SYNC_SQL);
  else if(a==='share')natCall('share',['mizan-backup.json',$('mzExpOut').value]);
  else if(a==='imp')importText($('mzImpTxt').value);
  else if(a==='upchk')updCheck(true);

/* ---- Forecast of the coming months (lives in the log tab, feeds the home tiles) ---- */
function fcGet(){var f=S.fc||{};return{months:Math.max(1,Math.round(num(f.months)||4)),inc:(f.inc===undefined||f.inc==='')?incPlan():num(f.inc),exp:(f.exp===undefined||f.exp==='')?expPlan():num(f.exp),show:!!f.show,incl:f.incl!==false}}
function fcSelHas(k){var s=(S.fc&&S.fc.sel)||{};return s[k]===undefined?k===cm:!!s[k]}
function fcSelKeys(){var s=(S.fc&&S.fc.sel)||{},lk=linked()?linkKeys():[],c={};Object.keys(s).forEach(function(k){c[k]=1});c[cm]=1;return Object.keys(c).filter(function(k){var m=S.log[k];return fcSelHas(k)&&m&&(m.income.length||m.expense.length)&&lk.indexOf(k)<0}).sort()}
function fcSelNet(){return fcSelKeys().reduce(function(a,k){var m=S.log[k];return a+sum(m.income)-sum(m.expense)},0)}
function fcCalc(){var f=fcGet(),now=sum(S.assets)+linkNet(),net=(f.inc-f.exp)*f.months,sel=fcSelNet();return{months:f.months,inc:f.inc,exp:f.exp,incT:f.inc*f.months,expT:f.exp*f.months,net:net,now:now,sel:sel,selN:fcSelKeys().length,base:now+(f.incl?net:0),end:now+sel+(f.incl?net:0),show:f.show,incl:f.incl}}
function fcUi(){var c=fcCalc();$('fcTInc').textContent=fmt(c.incT);$('fcTExp').textContent=fmt(c.expT);$('fcNet').textContent=fmt(c.net);$('fcEnd').textContent=fmt(c.end);$('fcSel').textContent=fmt(c.sel);var sm=$('fcSelM'),sl=$('fcSelL');if(sm){sm.checked=fcSelHas(cm);var mm=S.log[cm]||{income:[],expense:[]};sl.textContent=t('fc_sel')+' ('+mlabel(cm)+': '+fmt(sum(mm.income)-sum(mm.expense))+')'}}
function fcSync(){var f=fcGet();$('fcM').value=String(f.months);$('fcInc').value=f.inc||'';$('fcExp').value=f.exp||'';$('fcShow').checked=f.show;$('fcIncl').checked=f.incl;fcUi()}

/* ---- Plan tab: goal progress + balance chart ---- */
function goalBar(pl){
  var w=$('gwrap'),b=$('gbar'),tx=$('gtxt');if(!w)return;var g=num(S.goal);
  if(g>0){var p=Math.max(0,Math.min(100,pl.end/g*100));w.hidden=false;b.style.width=p+'%';tx.textContent=(pl.end>=g?t('g_ok'):t('g_left')+': '+fmt(g-pl.end))+' ('+Math.round(p)+'%)'}
  else{w.hidden=true;tx.textContent=''}}
function chartRender(pl,inc){
  var el=$('chart');if(!el)return;
  var pts=[];pl.rows.forEach(function(r){if(r.type==='sal')pts.push([r.d.getTime(),r.bal-inc]);pts.push([r.d.getTime(),r.bal])});
  if(pts.length<2){el.innerHTML='';return}
  var x0=pts[0][0],x1=pts[pts.length-1][0],ys=pts.map(function(p){return p[1]}),mn=Math.min.apply(null,ys.concat([0])),mx=Math.max.apply(null,ys);if(mx<=mn)mx=mn+1;
  var W=600,H=230,L=12,R=12,T0=14,B=30,px=function(x){return L+(x-x0)/((x1-x0)||1)*(W-L-R)},py=function(y){return T0+(1-(y-mn)/(mx-mn))*(H-T0-B)};
  var line=pts.map(function(p,i){return (i?'L':'M')+px(p[0]).toFixed(1)+' '+py(p[1]).toFixed(1)}).join(' ');
  var area=line+' L'+px(x1).toFixed(1)+' '+(H-B)+' L'+px(x0).toFixed(1)+' '+(H-B)+' Z';
  var grid=[0,1,2,3].map(function(i){var y=T0+i*(H-T0-B)/3;return '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'" style="stroke:var(--line)" stroke-width="1"/>'}).join('');
  var g=num(S.goal),gl=(g>mn&&g<mx)?'<line x1="'+L+'" x2="'+(W-R)+'" y1="'+py(g).toFixed(1)+'" y2="'+py(g).toFixed(1)+'" stroke="#d9822b" stroke-dasharray="6 5" stroke-width="2"/>':'';
  el.innerHTML='<svg viewBox="0 0 '+W+' '+H+'" style="direction:ltr;width:100%;display:block" role="img">'+grid+gl+'<path d="'+area+'" fill="rgba(31,157,108,.16)"/><path d="'+line+'" fill="none" stroke="#1f9d6c" stroke-width="3" stroke-linejoin="round"/>'+
   '<text x="'+L+'" y="'+(H-8)+'" font-size="12" style="fill:var(--muted)">'+fdate(pl.rows[0].d)+'</text><text x="'+(W-R)+'" y="'+(H-8)+'" text-anchor="end" font-size="12" style="fill:var(--muted)">'+fdate(pl.rows[pl.rows.length-1].d)+'</text></svg>'}

/* ---- Log: add an income/expense entry from the add-row ---- */
function addEntry(k){
  var am=num($('aamt-'+k).value),c=$('asel-'+k).value,nn=($('aname-'+k).value||'').trim();
  if(!c){mzToast(t(k==='income'?'sel_inc':'sel_exp'));return}
  if(c==='custom'&&!nn){$('aname-'+k).hidden=false;$('aname-'+k).focus();return}
  if(!(am>0)){mzToast(t('m_noamt'));return}
  var m=getM();if(S.filled&&S.filled[cm]){delete S.filled[cm];$('lfill').hidden=true}
  var o={c:c,v:am};if(c==='custom')o.n=nn;m[k].push(o);save();
  $('aamt-'+k).value='';$('asel-'+k).value='';$('aname-'+k).value='';$('aname-'+k).hidden=true;
  lrows(k);lcalc()}

document.addEventListener('click',function(e){
  var b=e.target.closest?e.target.closest('[data-lnew],#fcCopy'):null;if(!b)return;
  if(b.dataset.lnew)addEntry(b.dataset.lnew);
  else if(b.id==='fcCopy'){var m=S.log[cm]||{income:[],expense:[]};S.fc=S.fc||{};S.fc.inc=sum(m.income);S.fc.exp=sum(m.expense);save();fcSync()}
});
document.addEventListener('input',function(e){
  var x=e.target;
  if(x.id==='fcInc'||x.id==='fcExp'){S.fc=S.fc||{};S.fc[x.id==='fcInc'?'inc':'exp']=x.value;save();fcUi()}
});
document.addEventListener('change',function(e){
  var x=e.target;
  if(x.id==='fcM'){S.fc=S.fc||{};S.fc.months=num(x.value);save();fcUi()}
  else if(x.id==='fcSelM'){S.fc=S.fc||{};S.fc.sel=S.fc.sel||{};S.fc.sel[cm]=!!x.checked;save();fcUi();lhist()}
  else if(x.id==='fcShow'||x.id==='fcIncl'){S.fc=S.fc||{};S.fc[x.id==='fcShow'?'show':'incl']=x.checked;save();fcUi()}
  else if(x.id&&x.id.indexOf('asel-')===0){var k=x.id.slice(5);$('aname-'+k).hidden=x.value!=='custom';if(x.value==='custom')$('aname-'+k).placeholder=t(k==='income'?'ph_income':'ph_expense')}
  else if(x.id==='mzCur'){S.cur=x.value;try{$('cur').value=S.cur}catch(er){}save();applyLang()}
  else if(x.id==='mzLang'){S.lang=(['de','en'].indexOf(x.value)>=0?x.value:'ar');save();applyLang()}
});

function updUrl(){var u='';try{u=localStorage.getItem('mz_up_url')||''}catch(e){}return u||window.__mzDef||''}
function updBanner(){if($('mzUpd'))return;var d=document.createElement('div');d.id='mzUpd';d.style.cssText='position:fixed;left:12px;right:12px;bottom:14px;z-index:9999;background:#0f7b5f;color:#fff;border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.25)';
  var s=document.createElement('span');s.textContent=t('up_new');var b=document.createElement('button');b.textContent=t('up_now');b.style.cssText='border:0;border-radius:10px;padding:8px 14px;font:inherit;font-weight:800;background:#fff;color:#0f7b5f;cursor:pointer';b.onclick=function(){location.reload()};d.appendChild(s);d.appendChild(b);document.body.appendChild(d)}
function updCheck(manual){
  var u=updUrl();if(!u){if(manual)mzToast(t('up_nourl'));return}
  try{fetch(u+(u.indexOf('?')<0?'?':'&')+'t='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('http');return r.text()}).then(function(html){
    var m=html.match(/name="mz-version"\s+content="(\d+)"/),v=m?parseInt(m[1],10):0;
    if(!v||html.indexOf('</html>')<0){if(manual)mzToast(t('up_bad'));return}
    if(v>(window.__mzCur||1)){try{localStorage.setItem('mz_up_html',html);localStorage.setItem('mz_up_ver',String(v))}catch(e){if(manual)mzToast(t('up_err'));return}updBanner()}
    else if(manual)mzToast(t('up_latest'))
  }).catch(function(){if(manual)mzToast(t('up_err'))})}catch(e){if(manual)mzToast(t('up_err'))}}
